# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
# Target triples for dependency checking
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
# RustSec advisory database
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Only fail on unmaintained crates that are direct dependencies
unmaintained = "workspace"
# Warn on yanked crates
yanked = "warn"
# Ignore advisories (use sparingly, with justification)
ignore = [
    # RUSTSEC-2026-0118: hickory-proto NSEC3 unbounded loop
    # Transitive via libp2p-mdns/libp2p-dns. libp2p 0.56 pins hickory-proto ^0.25.
    # Fix requires hickory-proto >=0.26.1, blocked on libp2p update.
    # Low risk: only triggered by malicious DNS responses to mDNS/DNS resolver.
    # Tracked for removal when libp2p updates hickory dependency.
    "RUSTSEC-2026-0118",
    # RUSTSEC-2026-0119: hickory-proto CPU exhaustion in name compression
    # Same dependency chain and status as RUSTSEC-2026-0118 above.
    "RUSTSEC-2026-0119",
    # RUSTSEC-2025-0141: bincode 1.x is unmaintained
    # Direct dependency, used for serialization. bincode 3.x has breaking API changes.
    # Tracked for migration to bincode 3.x in a future refactor.
    "RUSTSEC-2025-0141",
]

[licenses]
# Allow these licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0", # webpki-roots
]
# Confidence threshold for license detection
confidence-threshold = 0.8

[bans]
# Deny multiple versions of the same crate
multiple-versions = "warn"
# Warn on wildcard dependencies
wildcards = "warn"
# Allow workspace duplicates (common in large projects)
workspace-default-features = "allow"
# Highlight duplicate crate graphs
highlight = "all"
# Skip certain crates from duplicate checks (use sparingly)
skip = []
# Skip specific versions of crates from duplicate checks
skip-tree = []

[sources]
# Only allow crates from crates.io
unknown-registry = "deny"
# Only allow git sources from known hosts
unknown-git = "deny"
# Allowed registries
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Allowed git sources (add if needed)
allow-git = []

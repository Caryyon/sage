---
# sage-node deployment - the NCA brain daemon
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sage-node
  namespace: sage
  labels:
    app: sage-node
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sage-node
  template:
    metadata:
      labels:
        app: sage-node
    spec:
      containers:
        # sage-node: NCA brain on port 19175
        - name: sage-node
          image: localhost:30500/sage-api:latest
          imagePullPolicy: Always
          command: ["sage-node"]
          args: ["--port", "19175"]
          env:
            - name: OLLAMA_HOST
              value: "http://192.168.0.94:11434"
          ports:
            - containerPort: 19175
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          # sage-node binds to 127.0.0.1 only; sage-api container's health check covers connectivity
        # sage-api: OpenAI-compatible HTTP API on port 19176
        # Runs as sidecar - connects to sage-node via localhost:19175
        - name: sage-api
          image: localhost:30500/sage-api:latest
          imagePullPolicy: Always
          command: ["sage-api"]
          args: ["--port", "19175", "--api-port", "19176"]
          ports:
            - containerPort: 19176
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 19176
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 19176
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: sage-api
  namespace: sage
  labels:
    app: sage-api
spec:
  selector:
    app: sage-node
  ports:
    - port: 80
      targetPort: 19176
      protocol: TCP
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sage-api
  namespace: sage
spec:
  ingressClassName: traefik
  rules:
    - host: api.whatssage.ai
      http:
        paths:
          - backend:
              service:
                name: sage-api
                port:
                  number: 80
            path: /
            pathType: Prefix

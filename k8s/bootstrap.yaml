---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sage-bootstrap
  namespace: sage
  labels:
    app: sage-bootstrap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sage-bootstrap
  template:
    metadata:
      labels:
        app: sage-bootstrap
    spec:
      containers:
        - name: sage-bootstrap
          image: localhost:30500/sage-bootstrap:latest
          imagePullPolicy: Always
          args: ["--port", "4001", "--no-mdns"]
          ports:
            - containerPort: 4001
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            tcpSocket:
              port: 4001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 4001
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: sage-bootstrap
  namespace: sage
  labels:
    app: sage-bootstrap
spec:
  selector:
    app: sage-bootstrap
  ports:
    - port: 4001
      targetPort: 4001
      nodePort: 30401
      protocol: TCP
  type: NodePort
---
# Traefik TCP IngressRoute for bootstrap.whatssage.ai:4001
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: sage-bootstrap
  namespace: sage
spec:
  entryPoints:
    - sage-bootstrap  # Must be defined in Traefik static config on port 4001
  routes:
    - match: HostSNI(`*`)
      services:
        - name: sage-bootstrap
          port: 4001

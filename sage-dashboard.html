<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAGE Database Monitor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
            background: #0a0a0a;
            color: #00ff00;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #00ffff;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-shadow: 0 0 10px #00ffff;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .panel {
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 255, 255, 0.1);
        }

        .panel h2 {
            color: #00ffff;
            margin-bottom: 15px;
            font-size: 1.5em;
            border-bottom: 2px solid #00ffff;
            padding-bottom: 5px;
        }

        .metric {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #2a2a2a;
        }

        .metric:last-child {
            border-bottom: none;
        }

        .label {
            color: #888;
        }

        .value {
            color: #00ff00;
            font-weight: bold;
        }

        .value.red {
            color: #ff4444;
        }

        .value.yellow {
            color: #ffff00;
        }

        .value.green {
            color: #00ff00;
        }

        .value.cyan {
            color: #00ffff;
        }

        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.9em;
        }

        .status.active {
            background: #004400;
            color: #00ff00;
        }

        .status.paused {
            background: #444400;
            color: #ffff00;
        }

        .event {
            padding: 6px 10px;
            margin: 4px 0;
            background: #0a2a0a;
            border-left: 3px solid #00ff00;
            border-radius: 3px;
            font-size: 0.9em;
        }

        .conversation {
            padding: 10px;
            margin: 8px 0;
            background: #0a1a2a;
            border-radius: 5px;
        }

        .conversation .sender {
            font-weight: bold;
            margin-bottom: 4px;
        }

        .conversation .sender.sage {
            color: #00ffff;
        }

        .conversation .sender.claude {
            color: #ff00ff;
        }

        .conversation .message {
            color: #aaa;
            font-size: 0.95em;
        }

        .conversation .gen {
            color: #666;
            font-size: 0.85em;
        }

        .loading {
            text-align: center;
            color: #666;
            font-style: italic;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .pulse {
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧬 SAGE Database Monitor</h1>
        <div class="subtitle">SpacetimeDB • 127.0.0.1:4000 • sage-db</div>

        <div class="grid">
            <!-- Current State -->
            <div class="panel">
                <h2>Current State</h2>
                <div id="current-state" class="loading pulse">Connecting...</div>
            </div>

            <!-- Pattern Progress -->
            <div class="panel">
                <h2>Pattern Progress</h2>
                <div id="pattern-progress" class="loading pulse">Loading...</div>
            </div>

            <!-- Recent Metrics -->
            <div class="panel">
                <h2>Recent Metrics</h2>
                <div id="recent-metrics" class="loading pulse">Loading...</div>
            </div>
        </div>

        <div class="grid">
            <!-- Training Events -->
            <div class="panel">
                <h2>Training Events</h2>
                <div id="training-events" class="loading pulse">Loading...</div>
            </div>

            <!-- Conversations (spanning 2 columns) -->
            <div class="panel" style="grid-column: span 2;">
                <h2>Conversations</h2>
                <div id="conversations" class="loading pulse">Loading...</div>
            </div>
        </div>
    </div>

    <script type="module" src="sage-dashboard-client/bundle.js"></script>
</body>
</html>

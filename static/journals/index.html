<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAGE Journals — Miniworld Reflections</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap');

*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a28;--bg4:#22223a;
  --text:#e0e0e0;--dim:#666;--border:#2a2a3a;
  --maya:#8b5a9f;--alex:#5c8a8a;--sarah:#7fb387;--marcus:#b85450;
}
body{font-family:'JetBrains Mono',monospace;background:var(--bg);color:var(--text);min-height:100vh}
a{color:#00d4aa;text-decoration:none}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;backdrop-filter:blur(12px);background:rgba(18,18,26,.85)}
.header h1{font-size:18px;font-weight:600;letter-spacing:2px;background:linear-gradient(90deg,var(--maya),var(--alex),var(--sarah),var(--marcus));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header .subtitle{font-size:11px;color:var(--dim);letter-spacing:3px;text-transform:uppercase}
.nav-links{display:flex;gap:16px;font-size:12px}
.nav-links a{color:var(--dim);transition:color .2s}
.nav-links a:hover{color:var(--text)}

/* Filter bar */
.filters{display:flex;gap:8px;padding:16px 24px;flex-wrap:wrap;align-items:center}
.filter-btn{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--bg2);color:var(--dim);cursor:pointer;font-family:inherit;font-size:11px;font-weight:500;letter-spacing:1px;transition:all .2s}
.filter-btn:hover{border-color:var(--text);color:var(--text)}
.filter-btn.active{color:#fff;border-color:transparent}
.filter-btn[data-instance="all"].active{background:var(--bg4);border-color:var(--dim)}
.filter-btn[data-instance="Maya"].active{background:rgba(139,90,159,.3);border-color:var(--maya);color:var(--maya)}
.filter-btn[data-instance="Alex"].active{background:rgba(92,138,138,.3);border-color:var(--alex);color:var(--alex)}
.filter-btn[data-instance="Sarah"].active{background:rgba(127,179,135,.3);border-color:var(--sarah);color:var(--sarah)}
.filter-btn[data-instance="Marcus"].active{background:rgba(184,84,80,.3);border-color:var(--marcus);color:var(--marcus)}

/* Journal grid */
.journal-container{max-width:900px;margin:0 auto;padding:0 24px 48px}
.journal-entry{position:relative;margin-bottom:24px;padding:24px;border-radius:12px;background:rgba(18,18,26,.7);border:1px solid var(--border);backdrop-filter:blur(8px);transition:all .3s}
.journal-entry:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,.3)}
.journal-entry[data-instance="Maya"]{border-left:3px solid var(--maya)}
.journal-entry[data-instance="Alex"]{border-left:3px solid var(--alex)}
.journal-entry[data-instance="Sarah"]{border-left:3px solid var(--sarah)}
.journal-entry[data-instance="Marcus"]{border-left:3px solid var(--marcus)}
.journal-entry[data-instance="Maya"]:hover{border-color:var(--maya);box-shadow:0 8px 32px rgba(139,90,159,.1)}
.journal-entry[data-instance="Alex"]:hover{border-color:var(--alex);box-shadow:0 8px 32px rgba(92,138,138,.1)}
.journal-entry[data-instance="Sarah"]:hover{border-color:var(--sarah);box-shadow:0 8px 32px rgba(127,179,135,.1)}
.journal-entry[data-instance="Marcus"]:hover{border-color:var(--marcus);box-shadow:0 8px 32px rgba(184,84,80,.1)}

.entry-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.entry-author{font-size:14px;font-weight:600}
.entry-author[data-instance="Maya"]{color:var(--maya)}
.entry-author[data-instance="Alex"]{color:var(--alex)}
.entry-author[data-instance="Sarah"]{color:var(--sarah)}
.entry-author[data-instance="Marcus"]{color:var(--marcus)}
.entry-date{font-size:11px;color:var(--dim);letter-spacing:1px}
.entry-mood{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:12px;font-size:11px;background:var(--bg4);color:var(--dim);margin-bottom:12px}
.entry-content{font-family:'Crimson Pro',serif;font-size:16px;line-height:1.7;color:#ccc;font-weight:300}
.entry-content p{margin-bottom:8px}
.entry-content p:last-child{margin-bottom:0}

/* Mood indicators */
.mood-happy{color:#ffd700}.mood-happy::before{content:'☀️'}
.mood-thoughtful{color:#87ceeb}.mood-thoughtful::before{content:'💭'}
.mood-tired{color:#9e9e9e}.mood-tired::before{content:'🌙'}
.mood-excited{color:#ff6b6b}.mood-excited::before{content:'⚡'}
.mood-melancholy{color:#7986cb}.mood-melancholy::before{content:'🌧️'}
.mood-peaceful{color:#81c784}.mood-peaceful::before{content:'🍃'}
.mood-curious{color:#ffb74d}.mood-curious::before{content:'🔍'}
.mood-proud{color:#e6a0ff}.mood-proud::before{content:'✨'}

/* Empty state */
.empty-state{text-align:center;padding:80px 24px;color:var(--dim)}
.empty-state .icon{font-size:48px;margin-bottom:16px}
.empty-state h2{font-size:16px;color:var(--text);margin-bottom:8px}
.empty-state p{font-size:12px;max-width:400px;margin:0 auto;line-height:1.6}

/* Loading */
.loading{text-align:center;padding:60px;color:var(--dim);font-size:13px}
.loading .spinner{display:inline-block;width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--alex);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Scrollbar */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

@media(max-width:640px){
  .journal-container{padding:0 12px 24px}
  .journal-entry{padding:16px}
  .entry-content{font-size:15px}
  .filters{padding:12px}
}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>📓 SAGE JOURNALS</h1>
    <div class="subtitle">Miniworld Daily Reflections</div>
  </div>
  <nav class="nav-links">
    <a href="/">Landing</a>
    <a href="/dashboard/">Dashboard</a>
    <a href="/miniworld/">Miniworld</a>
  </nav>
</div>

<div class="filters" id="filters">
  <button class="filter-btn active" data-instance="all">All</button>
  <button class="filter-btn" data-instance="Maya">🟣 Maya</button>
  <button class="filter-btn" data-instance="Alex">🔵 Alex</button>
  <button class="filter-btn" data-instance="Sarah">🟢 Sarah</button>
  <button class="filter-btn" data-instance="Marcus">🔴 Marcus</button>
</div>

<div class="journal-container" id="journalContainer">
  <div class="loading"><div class="spinner"></div><br>Loading journal entries...</div>
</div>

<script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAGE Neural Command</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap');

*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a28;--bg4:#22223a;
  --green:#00ff88;--red:#ff3366;--purple:#a855f7;--cyan:#00d4aa;
  --text:#e0e0e0;--dim:#666;--border:#2a2a3a;
}
body{font-family:'JetBrains Mono',monospace;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
a{color:var(--cyan);text-decoration:none}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.header h1{font-size:18px;font-weight:600;letter-spacing:2px;background:linear-gradient(90deg,var(--green),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header .subtitle{font-size:11px;color:var(--dim);letter-spacing:3px;text-transform:uppercase}
.conn-status{display:flex;align-items:center;gap:8px;font-size:12px}
.conn-dot{width:8px;height:8px;border-radius:50%;background:var(--red);transition:background .3s}
.conn-dot.connected{background:var(--green);box-shadow:0 0 8px var(--green)}

/* Layout */
.dashboard{display:grid;grid-template-columns:1fr 360px;grid-template-rows:auto 1fr;gap:16px;padding:16px;max-width:1600px;margin:0 auto}
@media(max-width:1024px){.dashboard{grid-template-columns:1fr}}

/* Panels */
.panel{background:var(--bg2);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.panel-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);font-size:13px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--dim)}
.panel-header .count{background:var(--bg4);padding:2px 8px;border-radius:10px;font-size:11px;color:var(--cyan)}
.panel-body{padding:16px;max-height:500px;overflow-y:auto}
.panel-body::-webkit-scrollbar{width:4px}
.panel-body::-webkit-scrollbar-track{background:var(--bg)}
.panel-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* Instance Grid */
.instances{grid-column:1;grid-row:1}
.instance-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.instance-card{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:14px;cursor:pointer;transition:all .2s}
.instance-card:hover{border-color:var(--cyan);transform:translateY(-1px)}
.instance-card.selected{border-color:var(--purple);box-shadow:0 0 12px rgba(168,85,247,.15)}
.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.card-name{font-size:14px;font-weight:600;color:#fff}
.badge{padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase}
.badge-online{background:rgba(0,255,136,.12);color:var(--green)}
.badge-offline{background:rgba(255,51,102,.12);color:var(--red)}
.badge-idle{background:rgba(168,85,247,.12);color:var(--purple)}
.card-role{font-size:11px;color:var(--dim);margin-bottom:8px}
.card-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;font-size:11px}
.stat{text-align:center}
.stat-val{font-size:16px;font-weight:600;color:var(--cyan)}
.stat-label{color:var(--dim);margin-top:2px}
.expertise-badge{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:500;background:var(--bg4);color:var(--purple);margin-top:6px}

/* Approvals */
.approvals{grid-column:2;grid-row:1/3}
@media(max-width:1024px){.approvals{grid-column:1;grid-row:auto}}
.approval-item{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:12px;margin-bottom:8px;transition:border-color .2s}
.approval-item:last-child{margin-bottom:0}
.approval-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.approval-type{font-size:12px;font-weight:600;color:#fff}
.risk{padding:2px 6px;border-radius:4px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
.risk-high{background:rgba(255,51,102,.15);color:var(--red)}
.risk-medium{background:rgba(255,170,0,.15);color:#ffaa00}
.risk-low{background:rgba(0,255,136,.15);color:var(--green)}
.approval-desc{font-size:11px;color:var(--dim);margin-bottom:8px;line-height:1.4}
.approval-instance{font-size:10px;color:var(--purple);margin-bottom:8px}
.approval-actions{display:flex;gap:6px}
.btn{padding:5px 12px;border-radius:4px;border:none;cursor:pointer;font-family:inherit;font-size:11px;font-weight:600;transition:all .15s}
.btn-approve{background:rgba(0,255,136,.15);color:var(--green)}
.btn-approve:hover{background:rgba(0,255,136,.3)}
.btn-reject{background:rgba(255,51,102,.15);color:var(--red)}
.btn-reject:hover{background:rgba(255,51,102,.3)}
.empty-state{text-align:center;padding:32px;color:var(--dim);font-size:12px}

/* Activity Feed */
.activity{grid-column:1;grid-row:2}
.feed-item{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid rgba(42,42,58,.5);font-size:11px;animation:fadeIn .3s ease}
.feed-item:last-child{border:none}
.feed-time{color:var(--dim);white-space:nowrap;min-width:65px}
.feed-type{min-width:70px}
.feed-msg{color:var(--dim);flex:1;word-break:break-word}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* Detail Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;justify-content:center;align-items:center}
.modal-overlay.active{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:10px;width:90%;max-width:700px;max-height:85vh;overflow-y:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-head h2{font-size:16px;color:#fff}
.modal-close{background:none;border:none;color:var(--dim);font-size:20px;cursor:pointer}
.modal-content{padding:20px}

/* Skills */
.skill-bar-wrap{margin-bottom:10px}
.skill-label{display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px}
.skill-label span:first-child{color:var(--text)}
.skill-label span:last-child{color:var(--cyan)}
.skill-track{height:6px;background:var(--bg);border-radius:3px;overflow:hidden}
.skill-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--purple),var(--cyan));transition:width .5s ease}

/* Task table */
.task-table{width:100%;border-collapse:collapse;font-size:11px;margin-top:12px}
.task-table th{text-align:left;padding:6px 8px;color:var(--dim);border-bottom:1px solid var(--border);font-weight:500;text-transform:uppercase;letter-spacing:1px;font-size:10px}
.task-table td{padding:6px 8px;border-bottom:1px solid rgba(42,42,58,.4)}
.task-success{color:var(--green)}
.task-fail{color:var(--red)}

/* Pulse */
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.pulse{animation:pulse 2s infinite}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>SAGE NEURAL COMMAND</h1>
    <div class="subtitle">Autonomous AGI Monitoring System</div>
  </div>
  <div class="conn-status">
    <div class="conn-dot" id="connDot"></div>
    <span id="connLabel">Disconnected</span>
  </div>
</div>

<div class="dashboard">
  <div class="panel instances">
    <div class="panel-header">Instances <span class="count" id="instanceCount">0</span></div>
    <div class="panel-body"><div class="instance-grid" id="instanceGrid"></div></div>
  </div>

  <div class="panel approvals">
    <div class="panel-header">Pending Approvals <span class="count" id="approvalCount">0</span></div>
    <div class="panel-body" id="approvalList"></div>
  </div>

  <div class="panel activity">
    <div class="panel-header">Live Activity Feed <span class="count pulse" id="feedCount">0</span></div>
    <div class="panel-body" id="activityFeed"></div>
  </div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle">Instance Detail</h2>
      <button class="modal-close" id="modalClose">&times;</button>
    </div>
    <div class="modal-content" id="modalContent"></div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>

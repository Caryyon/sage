[package]
name = "sage"
version = "0.5.2"
edition = "2021"
description = "SAGE - Distributed Intelligence System with NCA-based knowledge propagation"
default-run = "sage-cli"

[dependencies]
rand = "0.8"
ratatui = "0.26"
crossterm = "0.27"
rayon = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
chrono = "0.4"
reqwest = { version = "0.11", features = ["json", "blocking"] }
clap = { version = "4.5", features = ["derive", "env"] }
dotenvy = "0.15"

# Candle ML framework for local inference
candle-core = "0.8"
candle-nn = "0.8"
candle-transformers = "0.8"
hf-hub = "0.4"
tokenizers = "0.20"
regex = "1.12.2"
image = "0.25"

# Web (miniworld server + API)
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
dirs = "5.0"
toml = "0.8"

# Embedded embeddings (no external service required)
fastembed = "4"

# libp2p networking for decentralized gossip
libp2p = { version = "0.56", features = ["tcp", "noise", "yamux", "gossipsub", "mdns", "kad", "identify", "tokio", "macros", "dns", "request-response"] }
# Real Ed25519 keypair operations for node identity
ed25519-dalek = { version = "2" }
tracing = "0.1"
tokio-stream = "0.1"

# Local LLM via llama.cpp (optional, requires cmake)
llama_cpp = { version = "0.3", optional = true }

# Progress bars for model downloads
indicatif = "0.17"

[features]
default = ["embedded-llm"]
embedded-llm = []
ollama = []
local-llm = ["llama_cpp"]
cuda = ["llama_cpp/cuda"]
metal = ["llama_cpp/metal"]

[[bin]]
name = "sage-cli"
path = "src/bin/sage.rs"

[[bin]]
name = "sage-node"
path = "src/bin/sage_node.rs"

[[bin]]
name = "sage-bootstrap"
path = "src/bin/sage_bootstrap.rs"

[[bin]]
name = "sage_chat"
path = "src/bin/sage_chat.rs"

[[bin]]
name = "sage-api"
path = "src/bin/sage_api.rs"

[[bin]]
name = "sage-bench"
path = "src/bin/sage_bench.rs"

[[bin]]
name = "sage-train"
path = "src/bin/sage_train.rs"

[[bin]]
name = "sage-reservoir"
path = "src/bin/sage_reservoir.rs"

[[bin]]
name = "sage-criticality"
path = "src/bin/sage_criticality.rs"

[[bin]]
name = "sage-network-server"
path = "src/bin/sage_network_server.rs"

[[bin]]
name = "miniworld_server"
path = "src/bin/miniworld_server.rs"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"
tempfile = "3.10"

[[bench]]
name = "knowledge_bench"
harness = false

[[test]]
name = "knowledge_roundtrip"
path = "tests/integration/knowledge_roundtrip.rs"

[[test]]
name = "multi_node_sync"
path = "tests/integration/multi_node_sync.rs"

[[test]]
name = "chat_knowledge"
path = "tests/integration/chat_knowledge.rs"

[[test]]
name = "grid_stress"
path = "tests/integration/grid_stress.rs"

[[test]]
name = "libp2p_sync"
path = "tests/integration/libp2p_sync.rs"

[[test]]
name = "knowledge_loop"
path = "tests/integration/knowledge_loop.rs"

[[test]]
name = "attention_knowledge"
path = "tests/integration/attention_knowledge.rs"

[[test]]
name = "gossip_two_node"
path = "tests/integration/gossip_two_node.rs"

[[test]]
name = "node_lifecycle"
path = "tests/integration/node_lifecycle.rs"

[[test]]
name = "libp2p_direct_send"
path = "tests/integration/libp2p_direct_send.rs"

[[test]]
name = "e2e_local_llm"
path = "tests/e2e_local_llm.rs"

[[bin]]
name = "nca-timing"
path = "src/bin/nca_timing.rs"

[[bin]]
name = "train-nca"
path = "src/bin/train_nca.rs"

[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"

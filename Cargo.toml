[package]
name = "sage"
version = "0.6.3"
edition = "2021"
description = "SAGE - Distributed Intelligence System with NCA-based knowledge propagation"
default-run = "sage-cli"

[dependencies]
rand = "0.8"
ratatui = "0.26"
crossterm = "0.27"
rayon = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
chrono = "0.4"
reqwest = { version = "0.11", features = ["json", "blocking"] }
clap = { version = "4.5", features = ["derive", "env"] }
dotenvy = "0.15"
ctrlc = "3.4"

# Candle ML framework for local inference (CUDA optional via `cuda` feature)
candle-core = { version = "0.8" }
candle-nn = { version = "0.8" }
candle-transformers = { version = "0.8" }
hf-hub = "0.4"
tokenizers = "0.20"
regex = "1.12.2"
image = "0.25"

# Web (miniworld server + API)
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
dirs = "5.0"
toml = "0.8"

# Embedded embeddings (no external service required)
fastembed = "4"

# libp2p networking for decentralized gossip
libp2p = { version = "0.56", features = ["tcp", "noise", "yamux", "gossipsub", "mdns", "kad", "identify", "tokio", "macros", "dns", "request-response"] }
# Real Ed25519 keypair operations for node identity
ed25519-dalek = { version = "2" }
tracing = "0.1"
tokio-stream = "0.1"

# Local LLM via llama.cpp (optional, requires cmake)
llama_cpp = { version = "0.3", optional = true }

# Progress bars for model downloads
indicatif = "0.17"

[features]
default = ["embedded-llm"]
embedded-llm = []
ollama = []
local-llm = ["llama_cpp"]
cuda = ["llama_cpp/cuda", "candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
metal = ["llama_cpp/metal"]


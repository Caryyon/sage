[workspace]
members = [".", "sage-training", "sage-db"]
resolver = "2"

[package]
name = "sage"
version = "0.1.0"
edition = "2021"
description = "SAGE - Self-Adaptive General Explorer: An autonomous AGI system with curiosity-driven learning"
default-run = "sage"

[dependencies]
rand = "0.8"
ratatui = "0.26"
crossterm = "0.27"
rayon = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
spacetimedb-sdk = "1.6"
tokio = { version = "1", features = ["full"] }
libloading = "0.8"
notify = "6.1"  # File watcher for hot reload
irc = "0.15"  # IRC client for SAGE chat
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "rustls_backend", "model"] }  # Discord bot
futures = "0.3"  # Async runtime utilities
chrono = "0.4"  # Timestamp formatting
reqwest = { version = "0.11", features = ["json", "blocking"] }  # HTTP client for LLM API
ureq = "2.9"  # Simple HTTP client for tool system
urlencoding = "2.1"  # URL encoding for web searches
nokhwa = { version = "0.10", features = ["input-native"] }  # Camera capture
image = "0.25"  # Image processing and resizing (matches nokhwa)
clap = { version = "4.5", features = ["derive"] }  # CLI argument parsing
dotenvy = "0.15"  # Load environment variables from .env files
rodio = "0.17"  # Audio playback for sonification
cpal = "0.15"  # Audio input from microphone
rustfft = "6.1"  # FFT for audio frequency analysis

[package]
name = "sage-training"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]  # cdylib for hot reload, rlib for development

[dependencies]
rand = "0.8"
rayon = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Re-export from parent for now
sage = { path = ".." }
